# 传统检测的离线合成场景契约；不得直接复制到设备配置。
# 日常参数统一在 ../fast_choose.yaml；直接以本文件为入口时固定使用 traditional。
fast_choose_file: ../fast_choose.yaml
execution: replay
role: infantry
initial_mode: assist
operator_input:
  kind: legacy_enable_event # 合成事件格式契约；使用原始独立按键清单时改为 button。
device_id: synthetic-camera
configuration_id: synthetic-v1
calibration_file: calibration.yaml
geometry_files: [geometry.yaml]
launch_origin_world_m: [0, 0, 0]
aim_reference_to_world_wxyz: [1, 0, 0, 0]
detector:
  kind: traditional
  plate_type: small # 仅合成场景显式约定，不推断真实目标尺寸。
corners: {indices: [0, 1, 2, 3], model_id: traditional, mapping_id: unverified-physical-order}
plate_sizes:
  - {plate_type: small, width_m: 0.135, height_m: 0.055}
ballistic:
  gravity_mps2: [0, 0, -9.81]

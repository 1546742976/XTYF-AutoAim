# YOLOv5 离线场景及模型解释契约；不是设备标定。
# 日常参数和模型路径统一在 ../fast_choose.yaml；直接以本文件为入口时固定使用 yolov5。
fast_choose_file: ../fast_choose.yaml
execution: replay
role: infantry
initial_mode: assist
operator_input:
  kind: legacy_enable_event # 合成事件格式契约；使用独立按键清单时改为 button。
device_id: synthetic-camera
configuration_id: synthetic-v1
calibration_file: calibration.yaml
geometry_files: [geometry.yaml]
launch_origin_world_m: [0, 0, 0]
aim_reference_to_world_wxyz: [1, 0, 0, 0]
detector:
  kind: yolov5
  # 本模型不输出板型，必须按实际数据声明；未声明仅保留二维检测。
  plate_type_by_class: []
  # plate_type_by_class: [{raw_class_id: 3, plate_type: small}]
corners: {indices: [0, 1, 2, 3], model_id: yolov5, mapping_id: unverified-physical-order}
plate_sizes:
  - {plate_type: small, width_m: 0.135, height_m: 0.055}
  - {plate_type: big, width_m: 0.230, height_m: 0.055} # 仅离线测试尺寸，实机须核实。
ballistic:
  gravity_mps2: [0, 0, -9.81]

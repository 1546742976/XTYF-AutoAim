# 仅用于 640x480 合成场景；不是任何实际相机的标定。
calibration:
  width: 640
  height: 480
  camera_matrix: [800, 0, 320, 0, 800, 240, 0, 0, 1]
  distortion: [0, 0, 0, 0, 0]
  camera_to_gimbal_quaternion_wxyz: [0.5, -0.5, 0.5, -0.5]
  camera_to_gimbal_translation_m: [0, 0, 0]
  intrinsics_declared: true
  extrinsics_declared: true
